# Publishes web/ to GitHub Pages.
#
# One-time setup: in the repository's Settings -> Pages, set "Source" to
# "GitHub Actions". Without that this workflow builds fine but has nowhere to
# deploy to.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merged change is
# not dropped on the floor by the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/configure-pages@v5

      - run: npm ci

      # Same guard as CI: never ship a word list that has drifted from the one
      # the Go solver embeds.
      - run: npm run check:generated

      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
