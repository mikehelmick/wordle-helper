name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -coverprofile=coverage.out

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: staticcheck and govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # src/data/words.ts is generated from the Go package's embedded word list.
      # Regenerating here catches the case where words5.txt changed but the
      # committed TypeScript copy did not, which would silently give the two
      # solvers different dictionaries.
      - name: Check the generated word list is current
        run: npm run check:generated

      - run: npm run typecheck

      # These assert against pkg/wordle/testdata/vectors.json, generated by the
      # Go tests. A failure here means the two implementations have diverged.
      - run: npm test

      - run: npm run build
